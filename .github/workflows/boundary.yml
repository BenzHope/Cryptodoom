
- name: Assert the engine has no policy
        run: |
          set -e
          [ -f v6.py ] || { echo "v6.py missing at repo root"; exit 1; }
          if grep -nE 'os\.environ\[' v6.py; then echo "v6.py hard-requires an env var (bracket subscript)"; exit 1; fi
          if grep -nE '\binput\s*\(' v6.py;  then echo "v6.py prompts interactively"; exit 1; fi
          if grep -nE 'logs/' v6.py;         then echo "v6.py writes into logs/"; exit 1; fi
          echo "boundary intact"
