name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preflight — repo manifest
        run: bash scripts/ci_preflight.sh

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify dependencies
        run: python verify.py

      - name: Engine self-test
        run: python v6.py --self-test

      - name: Offline pipeline (seeded, reproducible)
        run: python v6_offline.py --seed 1337 --reproduce

      - name: Assert tests actually collected
        run: |
          n=$(python -m pytest tests/ --collect-only -q 2>/dev/null | grep -c '::' || true)
          echo "collected $n tests"
          [ "$n" -ge 10 ] || { echo "only $n tests collected — expected >= 10"; exit 1; }

      - name: Unit tests
        run: python -m pytest tests/ -q -ra

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs/
          if-no-files-found: ignore
